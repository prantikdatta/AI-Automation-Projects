[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-automation"
version = "0.1.0"
description = "Production-ready Job Search Automation platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Prantik Datta" }
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "tenacity",
    "structlog",
    "apify-client",
    "gspread",
    "google-auth",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"

[tool.coverage.run]
source = ["src/job_search_automation"]